defaults:
  - _self_
  - /encoder@experiment.encoder: resnet50
  - /loss: ce
  - /datamodule: multitask
  - /trainer: default
  - /logger: wandb
  - /callbacks: multitask

model:
  _target_: src.experiment.multitask_module_multitask.MultiTaskModule
  encoder: ${experiment.encoder}
  # two heads
  num_label_type_classes: 3      # ear / nose / throat
  num_label_classes: 12          # fine-grained classes
  # reuse the same CE (with label smoothing) for both heads
  loss_fn_type: ${experiment.loss}
  loss_fn_label: ${experiment.loss}
  # relative weights (tune if needed)
  w_label_type: 0.3
  w_label: 1.0
  max_epochs: ${experiment.trainer.max_epochs}
  enable_joint: true
  joint_mode: full   # dùng chế độ full (36 lớp = type * label)

datamodule: ${datamodule}
logger: ${logger}
callbacks: ${callbacks}
trainer: ${trainer}
loss: ${loss}

name: multitask

notes: "Multi-task experiment with separate heads for label_type (3) and label (12)."
